services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labtrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-labtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - labtrack-network

  python-ai:
    build:
      context: ./LabTrack.Python
      dockerfile: Dockerfile
    container_name: labtrack-python-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-labtrack_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CSHARP_API_BASE_URL: http://api:8080
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gemini-2.5-flash}
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    networks:
      - labtrack-network

  api:
    build:
      context: ./LabTrack.CSharp
      dockerfile: Dockerfile
    container_name: labtrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-ai:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-labtrack_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      PythonAi__BaseUrl: http://python-ai:8000
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - labtrack-network

  nginx:
    image: nginx:1.25-alpine
    container_name: labtrack-nginx
    restart: unless-stopped
    depends_on:
      - api
      - python-ai
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - labtrack-network

networks:
  labtrack-network:
    driver: bridge

volumes:
  postgres_data:
    name: labtrack_postgres_data
