<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 3D Dark Navy Glass Base -->
    <radialGradient id="tileBg" cx="32%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Dual-Tone Cyan-to-Gold Metallic Border -->
    <linearGradient id="tileRim" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Brushed Aluminum Monitor Chassis -->
    <linearGradient id="chassisGrad" x1="10" y1="12" x2="54" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Deep OLED Screen Glass -->
    <linearGradient id="screenGrad" x1="14" y1="16" x2="50" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="55%" stop-color="#06172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Realistic Diagonal Glass Reflection -->
    <linearGradient id="glassGlare" x1="13" y1="15" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sculpted Gold-Titanium Stand -->
    <linearGradient id="standNeck" x1="28" y1="42" x2="36" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="standBase" x1="20" y1="49" x2="44" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glowing Live Telemetry Wave -->
    <linearGradient id="pulseGrad" x1="16" y1="28" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Security Shield Badge Gradient -->
    <linearGradient id="shieldFill" x1="43" y1="31" x2="57" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="43" y1="30" x2="57" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Drop Shadow & Neon Glow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. App Tile Base & Top Glass Edge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tileBg)" stroke="url(#tileRim)" stroke-width="2"/>
  <path d="M16 3.5H48C54.5 3.5 59.5 8 60.3 14.5C50 9.5 39 7.5 32 7.5C25 7.5 14 9.5 3.7 14.5C4.5 8 9.5 3.5 16 3.5Z" fill="#ffffff" fill-opacity="0.06"/>

  <!-- 2. Ambient Backlight Aura Behind Workstation -->
  <ellipse cx="32" cy="28" rx="20" ry="13" fill="#0ea5e9" fill-opacity="0.16"/>

  <!-- 3. Realistic 3D Workstation Stand & Cast Shadow -->
  <ellipse cx="32" cy="53.5" rx="15" ry="2.6" fill="#000000" fill-opacity="0.6"/>
  <path d="M28.5 41.5H35.5L37 49.5H27L28.5 41.5Z" fill="url(#standNeck)"/>
  <rect x="20.5" y="48.5" width="23" height="3.8" rx="1.9" fill="url(#standBase)" filter="url(#softShadow)"/>
  <rect x="23" y="49.2" width="18" height="1" rx="0.5" fill="#fef3c7" fill-opacity="0.65"/>

  <!-- 4. 3D Shaded Monitor Body & Bezel -->
  <g filter="url(#softShadow)">
    <rect x="9.5" y="13" width="45" height="30" rx="5.5" fill="url(#chassisGrad)"/>
    <rect x="10.25" y="13.75" width="43.5" height="28.5" rx="4.75" stroke="#94a3b8" stroke-opacity="0.38" stroke-width="1"/>
  </g>

  <!-- 5. OLED Display Screen & Subtle Grid -->
  <rect x="12.5" y="16" width="39" height="22.5" rx="3" fill="url(#screenGrad)"/>
  <path d="M12.5 23.5H51.5M12.5 31H51.5M25.5 16V38.5M38.5 16V38.5" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="0.75"/>

  <!-- Mini Corner QR Calibration Brackets Inside Screen -->
  <path d="M15.5 20V18.5H17M48.5 20V18.5H47M15.5 34.5V36H17" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live Glowing Hardware Telemetry Heartbeat Pulse -->
  <path d="M15.5 28.5H22.2L25.2 22L28.8 34.2L32.4 24.5L35.4 28.5H45" stroke="url(#pulseGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)"/>

  <!-- Screen Diagonal Glass Glare -->
  <path d="M15.5 16H36L23 38.5H15.5C13.84 38.5 12.5 37.16 12.5 35.5V19C12.5 17.34 13.84 16 15.5 16Z" fill="url(#glassGlare)"/>

  <!-- Monitor Chin Power Indicator LED -->
  <circle cx="32" cy="40.75" r="1.1" fill="#38bdf8"/>

  <!-- 6. Realistic Anti-Proxy Security Shield Badge (Bottom-Right) -->
  <g filter="url(#softShadow)">
    <path d="M50 31.5L57.5 34.5V40.8C57.5 45.3 54.3 48.9 50 50.5C45.7 48.9 42.5 45.3 42.5 40.8V34.5L50 31.5Z" fill="url(#shieldFill)" stroke="url(#shieldRim)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M46.6 40.9L49 43.3L53.8 38.2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
